site_name: Servant Leadership Mastery Path
site_description: A structured, module-wise servant leadership training program from entry level to master level.
site_url: https://sigilipelli.github.io/servant-leadership-mastery-path/
repo_url: https://github.com/SIGILIPELLI/servant-leadership-mastery-path
repo_name: servant-leadership-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is Servant Leadership?": level-1/01-what-is-servant-leadership.md
      - "02 · Self-Awareness & Emotional Intelligence Basics": level-1/02-self-awareness-emotional-intelligence.md
      - "03 · Active Listening": level-1/03-active-listening.md
      - "04 · Empathy in Leadership": level-1/04-empathy-in-leadership.md
      - "05 · Building Trust": level-1/05-building-trust.md
      - "06 · Empowering Others (Delegation Basics)": level-1/06-empowering-others-delegation-basics.md
      - "07 · Foundational Communication Skills": level-1/07-foundational-communication-skills.md
      - "08 · Feedback Basics (Giving and Receiving)": level-1/08-feedback-basics.md
      - "09 · Serving vs. Directing (The Mindset Shift)": level-1/09-serving-vs-directing.md
      - "10 · Project — Personal Servant Leadership Philosophy Statement": level-1/10-project-philosophy-statement.md
